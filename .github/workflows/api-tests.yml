# ============================================================
# API Tests CI/CD Pipeline
# Triggers: Every push + pull request to main branch
# OCC Relevance: Automated API validation in CI pipeline
# ============================================================

name: REST Assured API Tests

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'src/test/java/com/sdet/api/**'
      - 'src/test/resources/schemas/**'
      - 'pom.xml'
  pull_request:
    branches: [ main ]
  # Manual trigger — run on demand
  workflow_dispatch:

jobs:
  api-tests:
    name: Run API Test Suite
    runs-on: ubuntu-latest

    steps:
      # Step 1 — Checkout code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2 — Setup Java 11
      - name: Set Up Java 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: maven

      # Step 3 — Run API tests
      - name: Run REST Assured API Tests
        run: |
          mvn test \
            -Dtest="GetUsersTest,AuthApiTest,SchemaValidationTest,CRUDOperationsTest" \
            -Dapi.base.url=${{ vars.API_BASE_URL || 'https://reqres.in' }} \
            -Dmaven.test.failure.ignore=false
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}

      # Step 4 — Upload Allure results
      - name: Upload Allure Results
        uses: actions/upload-artifact@v4
        if: always()  # Upload even if tests fail — audit evidence
        with:
          name: allure-results-api-${{ github.run_number }}
          path: allure-results/
          retention-days: 30

      # Step 5 — Generate and publish Allure report
      - name: Generate Allure Report
        uses: simple-elf/allure-report-action@master
        if: always()
        with:
          allure_results: allure-results
          allure_report: allure-report
          allure_history: allure-history

